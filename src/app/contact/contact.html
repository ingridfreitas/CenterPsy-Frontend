<section id="contato" class="contact-section">
  <div class="contact-container">

    <div class="contact-intro">
      <span class="contact-label">PRIMEIRO CONTATO</span>

      <h2>Vamos começar por aqui.</h2>

      <p>
        Um primeiro contato pode ser o começo de uma conversa.
        Preencha o formulário para enviar sua mensagem.
      </p>
    </div>

    <div class="contact-form-container">
      <form class="contact-form" (submit)="enviarFormulario($event)">

        <div class="form-group">
          <label for="nome">Nome</label>
          <input
            type="text"
            id="nome"
            name="nome"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            autocomplete="tel"
            required
          >
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem</label>
          <textarea
            id="mensagem"
            name="mensagem"
            rows="5"
            required
          ></textarea>
        </div>

        <button type="submit" class="contact-button">
          Enviar mensagem
        </button>

      </form>
    </div>

  </div>
</section>
